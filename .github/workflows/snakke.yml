name: Generate Contribution Grid

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution grid + snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: krutkarsh14
          outputs: |
            dist/github-contribution-grid.svg?palette=github-dark&hide_snake=true
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
